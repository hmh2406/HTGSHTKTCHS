<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ tay sư phạm — Bài giảng</title>
<link rel="stylesheet" href="shared.css">
<style>
  .lecture-layout{ display:grid; grid-template-columns:280px 1fr; gap:22px; align-items:start; }
  @media (max-width:820px){ .lecture-layout{ grid-template-columns:1fr; } }

  .video-nav{
    background:var(--paper-card); border:1.5px solid var(--ink); border-radius:var(--radius);
    padding:14px; box-shadow:3px 3px 0 rgba(44,44,42,.08); position:sticky; top:100px;
  }
  .video-nav__item{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:var(--radius);
    cursor:pointer; font-size:.85rem; margin-bottom:2px;
  }
  .video-nav__item:hover{ background:rgba(143,168,155,.12); }
  .video-nav__item.active{ background:var(--accent-tint); font-weight:600; }
  .video-nav__item.locked{ opacity:.45; cursor:not-allowed; }
  .video-nav__item.locked:hover{ background:none; }
  .video-nav__badge{ width:20px; text-align:center; font-size:.85rem; }

  .player-wrap video{ width:100%; border:1.5px solid var(--ink); border-radius:var(--radius); background:#000; display:block; }
  .player-note{ font-family:var(--font-mono); font-size:.7rem; color:var(--moss-deep); margin-top:8px; }

  .progress-block{ margin:20px 0; }
  .progress-block .thuoc-do{ margin-top:8px; }
  .progress-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }

  .exercise-card{
    border:1px solid var(--grid-line-bold); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; background:var(--paper);
  }
  .exercise-card h4{ margin:0 0 4px; font-family:var(--font-display); font-size:1.02rem; }
  .exercise-card p{ margin:0 0 8px; color:var(--ink-soft); font-size:.86rem; }
  .level-tag-basic{ color:var(--moss-deep); }
  .level-tag-medium{ color:var(--accent-dark); }
  .level-tag-advanced{ color:var(--accent); }
</style>
</head>
<body>

<nav class="so-tay-nav">
  <div class="so-tay-nav__top">
    <div class="so-tay-nav__brand">Sổ tay sư phạm <small>Bài giảng</small></div>
    <div class="so-tay-nav__student"><a href="trangchu.html" style="text-decoration:none; font-weight:600;">← Trang chủ</a></div>
  </div>
</nav>

<main>
  <p class="eyebrow" id="className">Lớp học</p>
  <h1 class="page-title" id="topicName">Chủ đề</h1>

  <div class="progress-block">
    <div class="progress-label"><span>Tiến độ bài giảng</span><span id="progressPct">0%</span></div>
    <div class="thuoc-do"><div class="thuoc-do__fill" id="progressFill" style="width:0%;"></div></div>
    <p class="footnote" id="progressDetail"></p>
  </div>

  <div class="lecture-layout">
    <div class="video-nav" id="videoNav"></div>

    <div>
      <div class="player-wrap">
        <video id="player" controls></video>
        <p class="player-note">Có thể xem lại các video đã học, nhưng không thể tua tới phần chưa xem của video hiện tại.</p>
      </div>

      <div class="divider"></div>

      <p class="card__label">Bài tập đề xuất cho bài này</p>
      <div id="exerciseList"></div>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="hocbai.js"></script>
</body>
</html>
