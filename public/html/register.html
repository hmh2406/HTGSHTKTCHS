<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="register-view" class="screen center-screen active">
  <div class="auth-card">
    <button class="back-link" onclick="location.href='../index.html'">← Quay lại chọn chế độ</button>
    <div class="brandmark" style="margin-bottom:22px;"><div class="dot">E</div><span>EduTrack</span></div>
    <h3 style="margin:0 0 4px;">Đăng ký tài khoản giáo viên</h3>
    <p class="hint" style="margin-bottom:18px;">Tạo lớp học và cấp tài khoản cho học sinh</p>
    <div class="form-row"><label>Họ và tên</label><input id="register-name" placeholder="Nguyễn Lan Anh"></div>
    <div class="form-row"><label>Email</label><input id="register-email" placeholder="lananh@truong.edu.vn"></div>
    <div class="form-row"><label>Mật khẩu</label><input id="register-password" type="password" placeholder="Tạo mật khẩu"></div>
    <button class="pill-btn auth-submit" onclick="submitRegister()">Tạo tài khoản →</button>
    <p id="reg-error" class="reg-error hidden" style="color:#C1652E; font-size:13px; margin-top:12px;"></p>
    <p id="reg-success" class="reg-success hidden">✓ Tạo tài khoản thành công! Đang chuyển đến trang đăng nhập...</p>
    <p class="auth-foot">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </div>
</div>
<script src="../js/register.js"></script>
</body>
</html>
