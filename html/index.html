<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Gia sư hỗ trợ học tập cho học sinh</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="mode-select" class="screen active center-screen">
  <div class="brandmark"><div class="dot">E</div><span>Gia sư hỗ trợ học tập</span></div>
  <h1 class="cs-title">Học bổ sung <em>kiến thức</em>, tiến bộ ngày mai</h1>
  <p class="cs-sub">Chọn chế độ phù hợp với bạn để đăng nhập hoặc đăng ký tài khoản.</p>
  <div class="role-grid">
    <button class="role-card" id="role-teacher-btn">
      <div class="role-icon" style="background:var(--teal-glow);color:#0a6350;">🧑‍🏫</div>
      <h3>Dành cho giáo viên</h3>
      <p>Đăng ký tài khoản, quản lý lớp học và tạo đề thi cho học sinh.</p>
      <span class="role-cta" style="color:#0a6350;">Tiếp tục →</span>
    </button>
    <button class="role-card" id="role-student-btn">
      <div class="role-icon" style="background:var(--indigo-glow);color:var(--indigo-deep);">🎓</div>
      <h3>Dành cho học sinh</h3>
      <p>Đăng nhập bằng tài khoản do giáo viên cấp để bắt đầu học.</p>
      <span class="role-cta">Tiếp tục →</span>
    </button>
  </div>
</div>

<script src="../js/index.js"></script>
</body>
</html>
